name: FMCC F21 Operational Readiness Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fmcc-f21-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fmcc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fmcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fmcc
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-000000000000000000000000000000000000000000000000
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fmcc
      FMCC_RESTORE_DATABASE: fmcc_restore_smoke

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install reproducibly
        run: npm ci
      - name: Apply versioned migrations
        run: npm run db:migrate
      - name: Operational readiness contract
        run: node scripts/f21-readiness-contract.mjs
      - name: Security and tenant adversarial suite
        run: >
          npx vitest run
          tests/auth.integration.test.ts
          tests/security.unit.test.ts
          tests/f19-adversarial.unit.test.ts
          tests/f19-alert-tenant-isolation.integration.test.ts
          tests/kca12-commercial-security.test.ts
          tests/audit-sanitization.unit.test.ts
      - name: High-confidence secret scan
        run: npm run security:secrets
      - name: PostgreSQL backup and isolated restore smoke
        run: bash scripts/postgres-backup-restore-smoke.sh
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
