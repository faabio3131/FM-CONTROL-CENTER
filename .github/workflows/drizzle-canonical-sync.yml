name: One-time Drizzle canonical sync

on:
  push:
    branches:
      - feat/d10-generic-central-billing
    paths:
      - src/infrastructure/db/billing-schema.ts
      - .github/workflows/drizzle-canonical-sync.yml

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://fmcc:fmcc@127.0.0.1:5432/fmcc

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/d10-generic-central-billing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate canonical migration metadata
        run: npm run db:generate
      - name: Commit generated migration set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          if git diff --cached --quiet; then
            echo "No migration changes generated"
            exit 0
          fi
          git commit -m "fix(db): generate canonical product billing migration"
          git push origin HEAD:feat/d10-generic-central-billing
