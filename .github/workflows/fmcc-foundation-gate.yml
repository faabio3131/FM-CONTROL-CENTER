name: FMCC Foundation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fmcc-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fmcc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fmcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fmcc
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-000000000000000000000000000000000000000000000000

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install reproducibly
        run: |
          npm ci --include=optional
          # npm occasionally omits the optional native Linux binding in CI.
          # Repair with the EXACT lockfile Rolldown version, never a floating tag.
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" || npm install --no-save --ignore-scripts --no-package-lock @rolldown/binding-linux-x64-gnu@1.2.14
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify migration matches schema
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
      - name: Apply versioned migration
        run: npm run db:migrate
      - name: Tests
        run: npm run test
      - name: Checkout pinned public Assistant (cross-runtime contract only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: faabio3131/-FM-Assistant-Base
          ref: 5fa69eb17c0126acb612d02892e7737136394fa4
          path: assistant-source
          persist-credentials: false
      - name: Checkout pinned public Core (internal quota and recovery)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: faabio3131/FM-Core-Base-
          ref: 5fd876d071b752f9d65d7a6b3c0c9355f2d00d5e
          path: core-source
          persist-credentials: false
      - name: Set up Python for Command to Assistant contract
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Assistant test harness
        run: |
          python -m pip install -e "./assistant-source[dev]" -e "./core-source[dev]" "psycopg[binary]>=3.2,<4"
          python -m pip check
      - name: Command to Assistant real-runtime signed envelope gate
        env:
          F3_THREE_PROCESS_NETWORK_GATE: "1"
        run: >-
          python -m pytest tests/f3_command_assistant_cross_runtime.py
          tests/f3_command_assistant_core_usage_recovery.py
          tests/f3_three_process_network.py
          tests/f3_command_license_quota_journey.py
          tests/f3_command_commercial_transition_contract.py
          tests/f3_command_qr_policy_contract.py
          tests/f3_command_license_security_hold_contract.py
          tests/f3_command_core_quota_readback_e2e.py -q -rs
      - name: Prove pinned Core signed readback API and no-reservation semantics
        working-directory: core-source
        run: python -m pytest tests/test_ai_command_quota_readback.py tests/test_ai_command_quota_runtime_mount.py tests/test_ai_command_finops_api.py tests/service/test_ai_finops_bucket_integrity.py tests/service/test_ai_usage_ledger.py tests/service/test_ai_admin_read_api.py tests/service/test_ai_finops_alert_policy.py -q -rs
      - name: Assistant F3 customer quota integrity regression
        working-directory: assistant-source
        run: python -m pytest tests/saas/test_plan_consumption_view.py tests/saas/test_f3_command_assistant_core_usage_contract.py -q -rs
      - name: Isolate tested Assistant checkout outside Next.js workspace
        run: |
          mkdir -p "$RUNNER_TEMP/f3-cross-runtime"
          mv assistant-source "$RUNNER_TEMP/f3-cross-runtime/assistant-source"
          mv core-source "$RUNNER_TEMP/f3-cross-runtime/core-source"
      - name: High-confidence secret scan
        run: npm run security:secrets
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Runtime smoke
        run: npm run test:runtime-smoke
      - name: Build Docker image without runtime secrets
        run: docker build --tag fmcc-render-smoke:${{ github.sha }} .
      - name: Runtime dependency audit
        run: bash scripts/runtime-dependency-audit.sh
