name: FMCC Foundation Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fmcc-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fmcc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fmcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fmcc
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-000000000000000000000000000000000000000000000000

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify migration matches schema
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
      - name: Apply versioned migration
        run: npm run db:migrate
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build Docker image without runtime secrets
        run: docker build --tag fmcc-render-smoke:${{ github.sha }} .
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
