name: FMCC Foundation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fmcc-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fmcc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fmcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fmcc
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-000000000000000000000000000000000000000000000000

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install reproducibly
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify migration matches schema
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
      - name: Apply versioned migration
        run: npm run db:migrate
      - name: Tests
        run: npm run test
      - name: Checkout pinned public Assistant (cross-runtime contract only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: faabio3131/-FM-Assistant-Base
          ref: ab30a89bfe4d15937b15ab0cc7ebb033030af803
          path: assistant-source
          persist-credentials: false
      - name: Checkout pinned public Core (internal quota and recovery)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: faabio3131/FM-Core-Base-
          ref: 3733c25e39d2c9df1203b4c9834604c7c96dbcb8
          path: core-source
          persist-credentials: false
      - name: Set up Python for Command to Assistant contract
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Assistant test harness
        run: |
          python -m pip install -e "./assistant-source[dev]" -e "./core-source[dev]"
          python -m pip check
      - name: Command to Assistant real-runtime signed envelope gate
        run: >-
          python -m pytest tests/f3_command_assistant_cross_runtime.py
          tests/f3_command_assistant_core_usage_recovery.py -q -rs
      - name: Isolate tested Assistant checkout outside Next.js workspace
        run: |
          mkdir -p "$RUNNER_TEMP/f3-cross-runtime"
          mv assistant-source "$RUNNER_TEMP/f3-cross-runtime/assistant-source"
          mv core-source "$RUNNER_TEMP/f3-cross-runtime/core-source"
      - name: High-confidence secret scan
        run: npm run security:secrets
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Runtime smoke
        run: npm run test:runtime-smoke
      - name: Build Docker image without runtime secrets
        run: docker build --tag fmcc-render-smoke:${{ github.sha }} .
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
