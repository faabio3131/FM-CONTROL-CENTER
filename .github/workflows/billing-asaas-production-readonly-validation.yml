name: Billing Asaas Production Read-Only Validation
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VALIDATE_PRODUCTION_READ_ONLY"
        required: true
        type: string
permissions:
  contents: read
jobs:
  default-branch-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Deny production validation on default branch
        run: |
          echo "::error::Select feat/central-billing-attribution-20261008; production validation is disabled on main."
          exit 1
